name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: echosupport_test
          POSTGRES_USER: echosupport
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echosupport -d echosupport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echosupport:integration-password@localhost:5432/echosupport_test
      DIRECT_URL: postgresql://echosupport:integration-password@localhost:5432/echosupport_test
      TEST_DATABASE_URL: postgresql://echosupport:integration-password@localhost:5432/echosupport_test
      JWT_SECRET: integration-jwt-secret-at-least-32-characters
      MASTER_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ADMIN_CORS_ORIGINS: https://admin.example
      UPLOADS_DIR: /tmp/echosupport-test-uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma client
        run: pnpm --filter @echosupport/backend db:generate

      - name: Verify integration database safety
        run: pnpm --filter @echosupport/backend test:integration:check-db

      - name: Test Phase 2 legacy upgrade migration
        run: |
          mv apps/backend/prisma/migrations/20260819090000_phase_2_identity_workspace_foundation /tmp/phase2_identity_workspace_foundation
          pnpm --filter @echosupport/backend db:migrate:deploy
          pnpm --filter @echosupport/backend exec prisma db execute --file prisma/fixtures/phase2-legacy-upgrade.sql
          mv /tmp/phase2_identity_workspace_foundation apps/backend/prisma/migrations/20260819090000_phase_2_identity_workspace_foundation
          pnpm --filter @echosupport/backend db:migrate:deploy
          pnpm --filter @echosupport/backend exec tsx src/db/assert-phase2-upgrade.ts

      - name: Re-run test database migrations
        run: pnpm --filter @echosupport/backend db:migrate:deploy

      - name: Check release consistency
        run: pnpm check:release

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Test authentication and tenant isolation with PostgreSQL
        run: pnpm --filter @echosupport/backend test:integration

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Container vulnerability scan
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build runner image
        run: docker build --target runner --build-arg VITE_APP_EDITION=pro --tag echosupport:security .

      - name: Scan runner image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: echosupport:security
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  compose-smoke:
    name: Docker Compose smoke test
    needs: ci
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: smoke-postgres-password
      JWT_SECRET: smoke-jwt-secret-at-least-32-characters
      MASTER_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CRON_SECRET: smoke-cron-secret-at-least-32-characters
      ADMIN_EMAIL: smoke@example.com
      ADMIN_PASSWORD: smoke-admin-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build images
        run: docker compose build

      - name: Start infrastructure
        run: docker compose up --detach --wait --wait-timeout 180 postgres qdrant

      - name: Apply migrations and seed data
        run: docker compose up migrate

      - name: Start application services
        run: docker compose up --detach --wait --wait-timeout 180 backend worker nginx

      - name: Run install readiness smoke
        run: node scripts/smoke-install-readiness.mjs

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
