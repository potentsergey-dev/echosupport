<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>EchoSupport</title>
    <meta name="description" content="EchoSupport is installed and ready to configure." />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #17201f;
        background: #f7f8f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #dce2df;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 60px rgb(23 32 31 / 10%);
      }

      .brand {
        margin: 0 0 28px;
        color: #5b3df2;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.045em;
      }

      p {
        max-width: 54ch;
        margin: 18px 0 0;
        color: #52605d;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        border-radius: 10px;
        font-weight: 700;
        text-decoration: none;
      }

      .primary {
        padding: 12px 18px;
        color: #fff;
        background: #5b3df2;
      }

      .secondary {
        padding: 12px 6px;
        color: #4330af;
      }

      .resources {
        margin-top: 34px;
        padding-top: 22px;
        border-top: 1px solid #e6ebe8;
        color: #68736f;
        font-size: 0.9rem;
      }

      .resources a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">EchoSupport</p>
      <h1>Your support workspace is ready.</h1>
      <p>Sign in to configure your first AI agent, knowledge base, website origins, and widget.</p>
      <div class="actions">
        <a class="primary" href="/admin">Open admin</a>
        <a class="secondary" href="https://github.com/potentsergey-dev/echosupport"
          >Installation guide</a
        >
      </div>
      <p class="resources">
        Widget resources: <a href="/embed.js">embed.js</a> and <a href="/widget.js">widget.js</a>
      </p>
    </main>
  </body>
</html>
